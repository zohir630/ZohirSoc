name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip আনজিপ
        run: |
          unzip -q zohirolaApp-main.zip
          ls

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: google-services.json তৈরি
        working-directory: synapseApp-main
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "zohirola-dummy",
              "storage_bucket": "zohirola-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000001",
                  "android_client_info": { "package_name": "com.synapse.social.studioasinc" }
                },
                "api_key": [ { "current_key": "dummy-key" } ]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000002",
                  "android_client_info": { "package_name": "com.synapse.social.studioasinc.debug" }
                },
                "api_key": [ { "current_key": "dummy-key" } ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Debug APK বিল্ড
        working-directory: synapseApp-main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GRADLE_OPTS: "-Xmx4g"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: Zohirola-debug-apk
          path: synapseApp-main/app/build/outputs/apk/debug/*.apk
