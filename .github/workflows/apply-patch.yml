name: Apply skip patch

on: workflow_dispatch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch প্রয়োগ
        run: |
          git apply skip-button.patch
          rm skip-button.patch

      - name: Commit ও Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add skip button"
          git push
